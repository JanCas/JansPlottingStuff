[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myplotstyle"
version = "0.1.1"
description = "Reusable Matplotlib style + colormap setup"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "cmcrameri>=1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
myplotstyle = ["*.mplstyle"]
